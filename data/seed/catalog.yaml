# Initial release catalog, compiled from the design doc (2026-09-23 survey + rigeltheatre.com).
# Same shape as the daily export. After seeding, the database is the source of truth: edit in /admin.
#
# Slot statuses: collected 已收录 · partial 部分缺档 · missing 缺档 · unreleased 未发行
#                planned 预定 · not_applicable 不适用 · unknown 待确认
# Slots not listed below default to `unknown` (待确认), which is honest for works we have not checked.

