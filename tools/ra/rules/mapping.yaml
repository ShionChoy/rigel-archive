# Path rules that suggest where each 合辑 file belongs. First match wins; order matters.
# Paths are relative to the 合辑 root with '/' separators; an archive member's path is the archive's path
# followed by its path inside it. Suggestions are confirmed by hand in the 整理台 (「按建议确认」), which
# puts the file at the suggested place and makes the edition or folders it names when they are missing.
#
#   match:      regular expression searched in the path
#   ext:        list of extensions (lower case, no dot)
#   release:    id | { catalog: <group> } | { title: <group> | $name, era: <era> }
#               ($name = file name without extension; title matching folds case, accents and punctuation)
#   slot:       which of the release's 7 slots; the file goes into an edition of that slot
#   edition:    name of that edition (default: the slot's unnamed edition) | { name: …, catalog: <group> }
#   folder:     a folder path ('a/b') under the edition, the release, the era (era: <id>) or at the top
#   keep:       true = the folders below the end of the match come along (a/b/c.txt → folder …/a/b)
#   seal:       true = keep the archive whole (its contents are not organized one by one)
#   readme:     true = the file is its folder's description
#   rights, role, state, confidence, note

# ------------------------------------------------------------------ junk
- name: 系统生成的文件
  match: '(?:^|/)(?:__MACOSX/|\._[^/]*$|(?i:thumbs\.db|desktop\.ini|\.ds_store)$)'
  state: ignored
  confidence: 0.95
  note: 操作系统自动生成的文件（缩略图缓存、macOS 资源分叉），不上站

- name: 残片与播放列表
  ext: [download, m3u, m3u8]
  state: ignored
  confidence: 0.95
  note: 下载残片或播放列表，不上站

